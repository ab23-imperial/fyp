<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Where to?</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB2Wng7KW3p4_b_skjJsJpmlHKW_3euUC8&libraries=places,marker"
    defer
  ></script>

  <script type="module" src="route.js"></script>
  <link rel="stylesheet" href="route.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#09090c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ArriveOnGreen">
  <link rel="apple-touch-icon" href="/icon.svg">
</head>

<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="logo">
      <div class="logo-dot"></div>
      ArriveOnGreen
    </div>

    <div class="right-controls">
      <div class="mode-toggle">
        <button class="mode-btn active" id="btn-sim" onclick="setMode('SIM')">Sim</button>
        <button class="mode-btn" id="btn-real" onclick="setMode('REAL')">Real</button>
      </div>
  
      <div class="avatar-btn" id="avatarBtn">
        <div class="avatar-initials" id="avatarInitials">👤</div>
      </div>
    </div>
  </header>

  <!-- HIDDEN SELECT FOR JS COMPAT -->
  <select id="mode">
    <option value="SIM">Simulation</option>
    <option value="REAL">Real GPS</option>
  </select>

  <!-- MAIN -->
  <div class="main">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h1 class="sidebar-heading loading" id="greeting">
        Hey <span id="user-name"></span>, Where are<br>you <span>headed?</span>
      </h1>

      <!-- search -->
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="8.5" cy="8.5" r="5.5"/>
          <path d="M13 13l3.5 3.5" stroke-linecap="round"/>
        </svg>
        <input id="search" type="text" placeholder="Search destination..." autocomplete="off" />
      </div>

      <!-- destination card -->
      <div class="dest-card" id="dest-card">
        <div class="dest-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
            <circle cx="12" cy="9" r="2.5"/>
          </svg>
        </div>
        <div class="dest-info">
          <div class="dest-label">Destination</div>
          <div class="dest-coords" id="dest-coords">No destination selected</div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- start -->
      <button id="startBtn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
        Start Navigation
      </button>
    </aside>

    <!-- MAP -->
    <div id="map"></div>

  </div>

  <script>
    function setMode(val) {
      document.getElementById("mode").value = val;
      document.getElementById("btn-sim").classList.toggle("active", val === "SIM");
      document.getElementById("btn-real").classList.toggle("active", val === "REAL");
    }
  </script>

  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
