<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ArriveOnGreen — Drive</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-rotate/dist/leaflet-rotate-src.js"></script>

  <link rel="stylesheet" href="drive_split.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#09090c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ArriveOnGreen">
  <link rel="apple-touch-icon" href="/icon.svg">
</head>
<body>

  <!-- MAP — full width, top portion of viewport -->
  <div id="map-shell">
    <div id="map"></div>
  </div>

  <!-- GLOWING SEAM between map and HUD -->
  <div id="divider"></div>

  <!-- HUD PANEL — speedometer -->
  <div id="hud">
    <div id="speedometer-wrap">
      <svg id="speedometer" viewBox="48 38 205 142">

        <path
          id="speed-arc-bg"
          d=""
          stroke="rgba(255,255,255,0.12)"
          stroke-width="18"
          fill="none"
          stroke-linecap="round"
        />

        <path
          id="speed-arc-target"
          d=""
          stroke="#4fffb0"
          stroke-width="18"
          fill="none"
          stroke-linecap="round"
        />

        <g id="ticks"></g>

        <line
          id="needle"
          x1="150" y1="150"
          x2="150" y2="50"
          stroke="white"
          stroke-width="4"
          stroke-linecap="round"
        />

        <circle cx="150" cy="150" r="8" fill="white" opacity="0.9"/>

      </svg>

      <div id="speed-readout">0 mph</div>

    </div>
  </div>

  <script type="module" src="drive.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
