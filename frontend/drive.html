<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ArriveOnGreen — Drive</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-rotate/dist/leaflet-rotate-src.js"></script>

  <link rel="stylesheet" href="drive_split.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#09090c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ArriveOnGreen">
  <link rel="apple-touch-icon" href="/icon.svg">
</head>
<body>

  <!-- MAP — thumbnail (mini) or full-screen (full), tap to toggle -->
  <div id="map-shell" class="mini">
    <div id="map-toggle"></div>
    <div id="map"></div>
  </div>

  <!-- MAP HUD — advice card shown when map is expanded -->
  <div id="map-hud">
    <div id="advice-card-map" style="
      background: rgba(10,10,14,0.85);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 14px 28px;
      display: flex; align-items: center; gap: 16px;
    ">
      <div id="map-signal-dot" style="width:12px;height:12px;border-radius:50%;background:#888;flex-shrink:0;transition:background 0.3s;"></div>
      <div style="font-family:'Space Grotesk',sans-serif;">
        <div id="map-advice" style="font-size:18px;font-weight:600;letter-spacing:-0.01em;">Loading...</div>
        <div id="map-text" style="font-size:13px;color:rgba(240,240,240,0.5);margin-top:2px;"></div>
      </div>
    </div>
  </div>

  <!-- DISTANCE PILL -->
  <div id="topbar">
    <div id="dist-pill"><span id="dist-val">—</span> m</div>
  </div>

  <!-- ROAD SCENE — trapezium window clips everything inside -->
  <div id="container">
    <div id="road"></div>
    <div id="overlay"></div>
    <img id="car" src="/ui/lib/car.png" />
  </div>

  <!-- GLOWING SEAM between road and HUD -->
  <div id="divider"></div>

  <!-- HUD PANEL — speedometer -->
  <div id="hud">
    <div id="speedometer-wrap">
      <svg id="speedometer" viewBox="48 38 205 142">

        <path
          id="speed-arc-bg"
          d=""
          stroke="rgba(255,255,255,0.12)"
          stroke-width="18"
          fill="none"
          stroke-linecap="round"
        />

        <path
          id="speed-arc-target"
          d=""
          stroke="#4fffb0"
          stroke-width="18"
          fill="none"
          stroke-linecap="round"
        />

        <g id="ticks"></g>

        <line
          id="needle"
          x1="150" y1="150"
          x2="150" y2="50"
          stroke="white"
          stroke-width="4"
          stroke-linecap="round"
        />

        <circle cx="150" cy="150" r="8" fill="white" opacity="0.9"/>

      </svg>

      <div id="speed-readout">0 mph</div>
    </div>
  </div>
  <script type="module" src="drive.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
